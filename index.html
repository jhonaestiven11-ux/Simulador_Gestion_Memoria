<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Gestión de Memoria</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <h1>Simulador de Memoria /h1>

    <div class="formulario">
        <input type="text" id="nombre" placeholder="Nombre de la tarea">

        <input type="number" id="tamano" placeholder="Tamaño en KB">

        <button onclick="agregarTarea()">
            Agregar Tarea
        </button>
    </div>

    <h2>Tabla de Memoria</h2>

    <table>
        <thead>
            <tr>
                <th>Partición</th>
                <th>Estado</th>
                <th>Tarea</th>
                <th>Fragmentación</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tablaMemoria">
        </tbody>
    </table>

    <h2>Estadísticas</h2>

    <p id="estadisticas"></p>

    <h2>Memoria</h2>

    <div id="memoria"></div>

    <script src="script.js"></script>

</body>
</html>
